<!doctype html>
<!-- Source of agentenflotte.png in the README. Render: see README.md in this folder. -->
<meta charset="utf-8">
<title>Brückenbild agentenflotte</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  html, body { margin: 0; background: transparent; }
  svg { display: block; width: 1200px; height: auto; }
  /* Transparent ground: the terminal and the radar are dark panels, the legend sits on a white plate. */
</style>
<svg id="pic" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Brückenbild: das Plugin agentenflotte im Terminal und als taktisches Display">
  <!-- desktop app: conversation and footer as the bridge draws them -->
  <rect x="30" y="20" width="740" height="420" rx="12" fill="#ffffff" stroke="#d9dbe1"/>
  <g font-family="Figtree" font-size="15" fill="#1d2330">
    <text x="56" y="58">Ich prüfe die Fundstellen und setze danach Paket 3 um.</text>
    <g id="rows"></g>
    <text x="56" y="232" font-size="15" fill="#c2410c" font-weight="700">✻ Warpkern kalibrieren…</text>

    <rect x="50" y="252" width="700" height="62" rx="10" fill="#fffbea" stroke="#ffcc33" stroke-width="2"/>
    <text x="70" y="278">Bearbeiten von <tspan font-family="JetBrains Mono" font-size="13">epic/SKILL.md</tspan> erlauben?</text>
    <text x="70" y="302" font-size="14" fill="#8a6d00" font-weight="700">▲ Alarmstufe Gelb · Maschinenraum erbittet Autorisierung</text>

    <text x="56" y="344" font-size="14" fill="#8b8f9a">Unter Warp · 1 min 12 s</text>

    <line x1="30" y1="370" x2="770" y2="370" stroke="#e6e7eb"/>
    <text x="56" y="410" font-size="13" fill="#5b6475">＋  Auto</text>
    <rect x="116" y="394" width="120" height="22" rx="11" fill="#ffcc33"/>
    <text x="176" y="410" text-anchor="middle" font-size="12" font-weight="700" fill="#1d2330">Alarmstufe Gelb</text>
    <text x="642" y="410" text-anchor="end" font-size="11" fill="#8b8f9a">agentenflotte  SZ 80784.8 · Warp 4 · Schilde 76 % · Flotte 3 · Alarmstufe Gelb</text>
    <text x="656" y="410" font-size="13" fill="#1d2330">Opus 5.5</text>
    <text x="716" y="410" font-size="13" fill="#1d2330">Mittel</text>
  </g>

  <!-- radar, geometry and colors as radarSvg in agentenflotte/hooks/taktik.tsx, scaled -->
  <g id="radar" transform="translate(810 20) scale(1.0)"></g>
  <g font-family="JetBrains Mono" font-size="12" fill="#5b6475" class="plates">
    <text x="990" y="410" text-anchor="middle" font-family="Figtree" font-weight="700" font-size="14" fill="#1d2330">/taktik · Taktisches Display</text>
    <text x="990" y="428" text-anchor="middle">Wissenschaft 1 · Maschinenraum 1 · Taktik 1</text>
  </g>

  <!-- legend -->
  <g font-family="Figtree" fill="#1d2330">
    <rect x="30" y="460" width="1140" height="84" rx="8" fill="#fff" stroke="#c9ced8"/>
    <text x="48" y="486" font-family="JetBrains Mono" font-size="12" letter-spacing="1.5" fill="#7c8699">ALARMSTUFE · DIE HÖCHSTE GILT</text>
    <circle cx="56" cy="510" r="7" fill="#ffcc33"/><text x="70" y="515" font-size="14"><tspan font-weight="700">Gelb</tspan> Subagent wartet auf Freigabe</text>
    <circle cx="56" cy="532" r="7" fill="#ff3300"/><text x="70" y="537" font-size="14"><tspan font-weight="700">Rot</tspan> Fehler oder Ausfall</text>
    <circle cx="316" cy="510" r="7" fill="#2288ff"/><text x="330" y="515" font-size="14"><tspan font-weight="700">Blau</tspan> Kontext unter 20 %, Komprimierung</text>

    <line x1="600" y1="476" x2="600" y2="534" stroke="#e3e6ec"/>
    <text x="620" y="486" font-family="JetBrains Mono" font-size="12" letter-spacing="1.5" fill="#7c8699">WARP = DENKSTUFE · SCHALTER /flotte</text>
    <text x="620" y="515" font-size="14">niedrig <tspan font-weight="700">2</tspan> · mittel <tspan font-weight="700">4</tspan> · hoch <tspan font-weight="700">6</tspan> · xhigh <tspan font-weight="700">8</tspan> · max <tspan font-weight="700">9,9</tspan></text>
    <text x="620" y="537" font-size="14" fill="#5b6475">Kontaktfarbe = Modell: <tspan fill="#c27a3f" font-weight="700">Haiku</tspan> · <tspan fill="#5566dd" font-weight="700">Sonnet</tspan> · <tspan fill="#8a6fc7" font-weight="700">Opus</tspan> · fertig grau</text>
  </g>
</svg>
<script>
  const NS = 'http://www.w3.org/2000/svg';
  const el = (parent, name, attrs, text) => {
    const e = document.createElementNS(NS, name);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (text !== undefined) e.textContent = text;
    parent.appendChild(e);
    return e;
  };

  // tool rows: the station label is a bold word in its color before the row (bruecke.tsx, ToolUse)
  const rows = document.getElementById('rows');
  [
    ['Sensorscan', '#fcc19f', 'Durchsucht epic-flotte/ nach FLOTTE-FRAGE'],
    ['Archiv', '#8a72a7', 'Las epic/SKILL.md'],
    ['Shuttlestart', '#baa4e5', 'epic-implementer-standard: Paket 3 umsetzen'],
    ['Maschinenraum', '#8899ff', 'Bearbeitet README.md'],
    ['Konsole', '#ea9c72', 'Run tests for package 3'],
  ].forEach(([station, color, text], i) => {
    const y = 92 + i * 26;
    const t = el(rows, 'text', { x: 56, y, 'font-size': 14 });
    el(t, 'tspan', { fill: color, 'font-weight': 700 }, station + '  ');
    el(t, 'tspan', { fill: '#8b8f9a' }, text + '  ›');
  });

  // radar
  const COLOR = { orange: '#eb943a', almond: '#fcc19f', violet: '#baa4e5', lilac: '#8a72a7', bluey: '#8899ff', gelb: '#ffcc33', space: '#05071a' };
  const SIZE = 360, MID = 180, RING_MAX = 165, RING_MIN = 34, FULL = 600;
  const radar = document.getElementById('radar');
  el(radar, 'circle', { cx: MID, cy: MID, r: MID - 3, fill: COLOR.space, stroke: COLOR.gelb, 'stroke-width': 4 });
  for (const r of [55, 110, RING_MAX]) el(radar, 'circle', { cx: MID, cy: MID, r, fill: 'none', stroke: COLOR.lilac, 'stroke-opacity': 0.5 });
  el(radar, 'path', { d: `M${MID} 12V${SIZE - 12}M12 ${MID}H${SIZE - 12}`, stroke: COLOR.lilac, 'stroke-opacity': 0.5 });
  const sweep = -35;
  for (let i = 0; i < 6; i++) {
    const p = (deg) => { const a = (deg + sweep) * Math.PI / 180; return `${MID + RING_MAX * Math.cos(a)} ${MID + RING_MAX * Math.sin(a)}`; };
    el(radar, 'path', { d: `M${MID} ${MID} L${p(-8 * (i + 1))} A${RING_MAX} ${RING_MAX} 0 0 1 ${p(-8 * i)} Z`, fill: COLOR.bluey, opacity: 0.28 - i * 0.045 });
  }
  const sa = sweep * Math.PI / 180;
  el(radar, 'line', { x1: MID, y1: MID, x2: MID + RING_MAX * Math.cos(sa), y2: MID + RING_MAX * Math.sin(sa), stroke: COLOR.bluey, 'stroke-opacity': 0.7 });
  el(radar, 'circle', { cx: MID, cy: MID, r: 7, fill: COLOR.orange });
  const dist = (s) => RING_MIN + (RING_MAX - RING_MIN) * Math.min(1, Math.log1p(s) / Math.log1p(FULL));
  [
    ['Spawn-Logik suc…', 40, 200, COLOR.almond, 1],
    ['Paket 3', 190, 30, COLOR.gelb, 1],
    ['Review Paket 2', 70, 130, COLOR.violet, 1],
    ['Fundstellen', 420, 300, '#8f96c8', 0.35],
  ].forEach(([label, secs, deg, color, op]) => {
    const r = dist(secs), a = deg * Math.PI / 180;
    const x = MID + r * Math.cos(a), y = MID + r * Math.sin(a), left = x > MID + 40;
    const g = el(radar, 'g', { opacity: op });
    el(g, 'circle', { cx: x, cy: y, r: 5, fill: color });
    el(g, 'text', { x: left ? x - 9 : x + 9, y: y + 3, 'text-anchor': left ? 'end' : 'start', style: 'font:10px sans-serif;fill:#cfd6ff' }, label);
  });

  // Plates behind the labels: texts of one note (same x, at most 24 px apart) share one plate.
  const union = (els) => els.map((e) => e.getBBox()).reduce((a, b) => {
    const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
    return { x, y, width: Math.max(a.x + a.width, b.x + b.width) - x, height: Math.max(a.y + a.height, b.y + b.height) - y };
  });
  document.fonts.ready.then(() => {
    for (const g of document.querySelectorAll('g.plates')) {
      const b = union([...g.querySelectorAll('text')]);
      const r = document.createElementNS(NS, 'rect');
      for (const [k, v] of Object.entries({ x: b.x - 9, y: b.y - 5, width: b.width + 18, height: b.height + 10, rx: 6, fill: '#ffffff', stroke: '#c9ced8' })) r.setAttribute(k, v);
      g.insertBefore(r, g.firstChild);
    }
  });
</script>
