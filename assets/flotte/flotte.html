<script>
  // Plates behind the labels: texts of one station (same x, at most 24 px apart) share one plate.
  const NS = 'http://www.w3.org/2000/svg';
  const plate = (parent, before, box) => {
    const r = document.createElementNS(NS, 'rect');
    for (const [k, v] of Object.entries({ x: box.x - 9, y: box.y - 5, width: box.width + 18, height: box.height + 10, rx: 6, fill: '#ffffff', stroke: '#c9ced8' })) r.setAttribute(k, v);
    parent.insertBefore(r, before);
  };
  const union = (els) => els.map((e) => e.getBBox()).reduce((a, b) => {
    const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
    return { x, y, width: Math.max(a.x + a.width, b.x + b.width) - x, height: Math.max(a.y + a.height, b.y + b.height) - y };
  });
  document.fonts.ready.then(() => {
    for (const g of document.querySelectorAll('g.plates')) {
      const groups = [];
      for (const t of g.querySelectorAll('text')) {
        const last = groups.at(-1);
        const prev = last?.at(-1);
        if (prev && prev.getAttribute('x') === t.getAttribute('x') && t.getAttribute('y') - prev.getAttribute('y') <= 24) last.push(t);
        else groups.push([t]);
      }
      for (const grp of groups) plate(grp[0].parentNode, grp[0], union(grp));
    }
    const legend = document.querySelector('g.plate-all');
    plate(legend, legend.firstChild, union([...legend.children]));
  });
</script>
